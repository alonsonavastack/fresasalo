<div style="max-width:800px;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
    <h2 style="font-family:'Cinzel',serif; font-size:1.8rem; color:var(--texto-primary); text-shadow:0 0 10px var(--neon-glow); margin:0;">
      ⚙️ Configuraciones
    </h2>
  </div>

  <div style="
    background:var(--bg-card);
    border:1px solid rgba(192,38,211,0.25);
    border-radius:16px; padding:1.5rem;
  ">
    <h3 style="color:var(--neon-light); font-family:'Cinzel',serif; margin-bottom:1.5rem; font-size:1.2rem;">
      Datos de Contacto
    </h3>
    
    <div style="display:grid; gap:1.5rem; max-width:600px;">
      
      <!-- Dirección -->
      <div>
        <label style="display:block; font-size:0.9rem; color:var(--texto-secondary); margin-bottom:0.4rem; font-weight:600;">
          📍 Dirección de la Tienda
        </label>
        <textarea
          [ngModel]="direccion()" (ngModelChange)="direccion.set($event)"
          rows="3"
          placeholder="Ej: Av. Principal 123, Colonia Centro..."
          style="
            width:100%; padding:0.75rem; border-radius:8px;
            background:var(--bg-surface); border:1px solid rgba(192,38,211,0.25);
            color:var(--texto-primary); font-family:'Nunito',sans-serif;
            font-size:1rem; resize:vertical;
          "
        ></textarea>
        <p style="font-size:0.75rem; color:rgba(255,255,255,0.4); margin-top:0.3rem;">
          Esta dirección aparecerá en el pie de página de la tienda.
        </p>
      </div>

      <!-- Teléfono -->
      <div>
        <label style="display:block; font-size:0.9rem; color:var(--texto-secondary); margin-bottom:0.4rem; font-weight:600;">
          📞 Teléfono de Contacto
        </label>
        <input type="tel"
          [ngModel]="telefono()" (ngModelChange)="telefono.set($event)"
          placeholder="Ej: +52 1 555 123 4567"
          style="
            width:100%; padding:0.75rem; border-radius:8px;
            background:var(--bg-surface); border:1px solid rgba(192,38,211,0.25);
            color:var(--texto-primary); font-family:'Nunito',sans-serif;
            font-size:1rem;
          " />
      </div>

      <!-- Horario -->
      <div>
        <label style="display:block; font-size:0.9rem; color:var(--texto-secondary); margin-bottom:0.4rem; font-weight:600;">
          ⏰ Horario de Atención
        </label>
        <input type="text"
          [ngModel]="horario()" (ngModelChange)="horario.set($event)"
          placeholder="Ej: 10:00 AM - 8:00 PM"
          style="
            width:100%; padding:0.75rem; border-radius:8px;
            background:var(--bg-surface); border:1px solid rgba(192,38,211,0.25);
            color:var(--texto-primary); font-family:'Nunito',sans-serif;
            font-size:1rem;
          " />
      </div>

      <!-- Días -->
      <div>
        <label style="display:block; font-size:0.9rem; color:var(--texto-secondary); margin-bottom:0.4rem; font-weight:600;">
          📅 Días de Disponibilidad
        </label>
        <input type="text"
          [ngModel]="dias()" (ngModelChange)="dias.set($event)"
          placeholder="Ej: Lunes a Sábado"
          style="
            width:100%; padding:0.75rem; border-radius:8px;
            background:var(--bg-surface); border:1px solid rgba(192,38,211,0.25);
            color:var(--texto-primary); font-family:'Nunito',sans-serif;
            font-size:1rem;
          " />
      </div>

      <!-- Botón de guardar -->
      <div style="margin-top:1rem; display:flex; align-items:center; gap:1rem;">
        <button (click)="save()" [disabled]="saving()"
          style="
            background:linear-gradient(135deg,var(--neon-dark),var(--neon));
            color:white; border:none; padding:0.75rem 1.5rem;
            border-radius:8px; font-family:'Nunito',sans-serif; font-size:0.95rem; font-weight:700;
            cursor:pointer; transition:all 0.2s;
            opacity: {{ saving() ? '0.7' : '1' }};
            box-shadow:0 4px 15px rgba(192,38,211,0.2);
          "
          onmouseenter="if(!this.disabled) { this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 20px rgba(192,38,211,0.4)'; }"
          onmouseleave="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 15px rgba(192,38,211,0.2)';">
          {{ saving() ? 'Guardando...' : '💾 Guardar Cambios' }}
        </button>

        @if (showSuccess()) {
          <span style="color:#4ade80; font-size:0.9rem; font-weight:600; display:flex; align-items:center; gap:0.4rem;">
            <span>✅</span> ¡Guardado con éxito!
          </span>
        }
      </div>

    </div>
  </div>
</div>
